# .github/workflows/ci.yml
# ObserveX CI — runs on every pull request and push to main.
# Stages: lint → test → build (all 9 services in parallel)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint (monorepo)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: observex
          args: --timeout=5m

      - name: golangci-lint (profiling)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: observex-profiling
          args: --timeout=5m

      - name: golangci-lint (synthetic)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: observex-synthetic
          args: --timeout=5m

      - name: golangci-lint (topology)
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: observex-neo4j
          args: --timeout=5m

  # ── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      # Start dependencies needed for integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: observex_test
          POSTGRES_USER: observex
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test — monorepo (unit + integration)
        working-directory: observex
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: observex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: observex_test
          CLICKHOUSE_HOST: localhost
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Test — profiling service
        working-directory: observex-profiling
        run: go test -race ./...

      - name: Test — synthetic checks (unit, no external deps)
        working-directory: observex-synthetic
        run: go test -race ./internal/checks/...

      - name: Test — topology queries (requires neo4j — skipped in CI)
        working-directory: observex-neo4j
        run: |
          # Integration tests require NEO4J_TEST_URI — skip in CI, run in e2e workflow
          go test -run "^$" ./... || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: observex/coverage.out
          flags: monorepo

  # ── Build (all services in parallel) ─────────────────────────────────────────
  build:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Monorepo services
          - service: ingestor
            dir: observex
            cmd: ./services/ingestor
          - service: processor
            dir: observex
            cmd: ./services/processor
          - service: ai-agent
            dir: observex
            cmd: ./services/ai-agent
          - service: api-gateway
            dir: observex
            cmd: ./services/api-gateway
          - service: oneagent
            dir: observex
            cmd: ./services/oneagent
            os: linux
            arch: amd64
          # Standalone services
          - service: query-engine
            dir: observex-query-engine
            cmd: ./cmd/queryengine
          - service: profiling
            dir: observex-profiling
            cmd: ./cmd/profiling
          - service: synthetic
            dir: observex-synthetic
            cmd: ./cmd/synthetic
          - service: topology
            dir: observex-neo4j
            cmd: ./cmd/topology
          - service: trivy-scanner
            dir: observex
            cmd: ./services/trivy-scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.dir }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os || 'linux' }}
          GOARCH: ${{ matrix.arch || 'amd64' }}
        run: |
          go build -trimpath -ldflags="-s -w \
            -X main.Version=${{ github.sha }} \
            -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o /tmp/${{ matrix.service }} \
            ${{ matrix.cmd }}
          echo "✓ ${{ matrix.service }} built ($(du -sh /tmp/${{ matrix.service }} | cut -f1))"

      - name: go vet ${{ matrix.service }}
        working-directory: ${{ matrix.dir }}
        run: go vet ./...

  frontend:
    name: Frontend — TypeScript + Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Production build
        run: cd frontend && npm run build

      - name: Check bundle size
        run: |
          echo "Bundle sizes:"
          du -sh frontend/dist/assets/*.js | sort -h

