# .github/workflows/cd.yml
# ObserveX CD — builds Docker images and pushes to GHCR on merge to main.
# Optionally deploys to a Kubernetes cluster via Helm.
name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"    # trigger on semver tags for production releases

env:
  GO_VERSION: "1.22"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/observex

jobs:
  # ── Determine version tag ─────────────────────────────────────────────────────
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ steps.tag.outputs.is_release }}
    steps:
      - id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
            echo "tag=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  # ── Build and push all Docker images ──────────────────────────────────────────
  docker:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestor
            dockerfile: services/ingestor/Dockerfile
            context: .
          - service: processor
            dockerfile: services/processor/Dockerfile
            context: .
          - service: ai-agent
            dockerfile: services/ai-agent/Dockerfile
            context: .
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
          - service: oneagent
            dockerfile: services/oneagent/Dockerfile
            context: .
          - service: query-engine
            dockerfile: services/query-engine/Dockerfile
            context: .
          - service: activegate
            dockerfile: services/activegate/Dockerfile
            context: .
          - service: db-monitor
            dockerfile: services/db-monitor/Dockerfile
            context: .
          - service: trivy-scanner
            dockerfile: services/trivy-scanner/Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release == 'true' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          platforms:  linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            BUILD_SHA=${{ github.sha }}

      - name: Image digest
        run: |
          echo "${{ matrix.service }} pushed: ${{ steps.meta.outputs.tags }}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ needs.version.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container/${{ matrix.service }}

  # ── Update Helm values with new image tags ────────────────────────────────────
  update-helm:
    name: Update Helm image tags
    runs-on: ubuntu-latest
    needs: [version, docker]
    if: needs.version.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in values.yaml
        working-directory: deployments/helm/observex
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          # Update all image tags in values.yaml
          for svc in ingestor processor aiAgent apiGateway oneagent queryEngine trivyScanner; do
            yq -i ".${svc}.image.tag = \"${TAG}\"" values.yaml
          done
          echo "Updated all image tags to ${TAG}"

      - name: Commit updated values
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/helm/observex/values.yaml
          git commit -m "chore: update image tags to ${{ needs.version.outputs.tag }}" || echo "no changes"
          git push

  # ── Deploy to Kubernetes (optional, only on release tags) ─────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [version, docker]
    if: |
      needs.version.outputs.is_release == 'true' &&
      vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Add Bitnami repo (for dependencies)
        run: helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update

      - name: Update Helm dependencies
        working-directory: deployments/helm/observex
        run: helm dependency update

      - name: Helm diff (dry-run preview)
        working-directory: deployments/helm
        run: |
          helm upgrade --install observex ./observex \
            --namespace observex \
            --create-namespace \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            --set ingestor.image.tag=${{ needs.version.outputs.tag }} \
            --set processor.image.tag=${{ needs.version.outputs.tag }} \
            --set aiAgent.image.tag=${{ needs.version.outputs.tag }} \
            --set apiGateway.image.tag=${{ needs.version.outputs.tag }} \
            --set oneagent.image.tag=${{ needs.version.outputs.tag }} \
            --set queryEngine.image.tag=${{ needs.version.outputs.tag }} \
            --dry-run 2>&1 | head -100

      - name: Helm upgrade (production)
        working-directory: deployments/helm
        run: |
          helm upgrade --install observex ./observex \
            --namespace observex \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            --set ingestor.image.tag=${{ needs.version.outputs.tag }} \
            --set processor.image.tag=${{ needs.version.outputs.tag }} \
            --set aiAgent.image.tag=${{ needs.version.outputs.tag }} \
            --set apiGateway.image.tag=${{ needs.version.outputs.tag }} \
            --set oneagent.image.tag=${{ needs.version.outputs.tag }} \
            --set queryEngine.image.tag=${{ needs.version.outputs.tag }} \
            --wait

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/observex-api-gateway -n observex --timeout=5m
          kubectl rollout status deployment/observex-ingestor     -n observex --timeout=5m
          kubectl rollout status daemonset/observex-oneagent       -n observex --timeout=5m
          echo "Deployment complete: ${{ needs.version.outputs.tag }}"
