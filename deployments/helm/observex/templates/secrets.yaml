{{/*
secrets.yaml
Creates the ObserveX secrets object when existingSecret is not set.
All sensitive values are stored here and referenced by Deployment env sections.
*/}}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observex.fullname" . }}-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "observex.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | required "secrets.jwtSecret is required" | quote }}
  admin-password: {{ .Values.secrets.adminPassword | required "secrets.adminPassword is required" | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | required "secrets.postgresPassword is required" | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | required "secrets.neo4jPassword is required" | quote }}
  {{- /*
  internal-token (S1-06): shared internal service token, mounted as a file and
  read through OBSERVEX_INTERNAL_TOKEN_FILE. Uses secrets.internalToken when set;
  otherwise reuses the value already in the cluster Secret (via lookup), or
  generates 48 random characters once. `helm template` and GitOps renderers
  cannot use lookup and would generate a new value on every render, so set
  secrets.internalToken or secrets.existingSecret there. Minimum 32 bytes.
  */}}
  {{- $internalToken := .Values.secrets.internalToken }}
  {{- if not $internalToken }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "observex.fullname" .)) }}
  {{- if and $existing $existing.data (index $existing.data "internal-token") }}
  {{- $internalToken = index $existing.data "internal-token" | b64dec }}
  {{- else }}
  {{- $internalToken = randAlphaNum 48 }}
  {{- end }}
  {{- end }}
  {{- if lt (len (trim $internalToken)) 32 }}
  {{- fail "secrets.internalToken must be at least 32 bytes after trimming whitespace" }}
  {{- end }}
  internal-token: {{ $internalToken | quote }}
  {{- if .Values.secrets.slackWebhookUrl }}
  slack-webhook-url: {{ .Values.secrets.slackWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.pagerdutyRoutingKey }}
  pagerduty-routing-key: {{ .Values.secrets.pagerdutyRoutingKey | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  smtp-password: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
{{- end }}
