{{/*
hpa.yaml
HorizontalPodAutoscaler resources.
Generated for any service with autoscaling.enabled=true.
Supports both CPU and memory-based scaling.
*/}}

{{- $services := list
  (dict "comp" "ingestor"    "vals" .Values.ingestor    "prefix" (include "observex.fullname" .))
  (dict "comp" "processor"   "vals" .Values.processor   "prefix" (include "observex.fullname" .))
  (dict "comp" "ai-agent"    "vals" .Values.aiAgent     "prefix" (include "observex.fullname" .))
  (dict "comp" "api-gateway" "vals" .Values.apiGateway  "prefix" (include "observex.fullname" .))
  (dict "comp" "query-engine" "vals" .Values.queryEngine "prefix" (include "observex.fullname" .))
  (dict "comp" "profiling"   "vals" .Values.profiling   "prefix" (include "observex.fullname" .))
  (dict "comp" "synthetic"   "vals" .Values.synthetic   "prefix" (include "observex.fullname" .))
  (dict "comp" "topology"    "vals" .Values.topology    "prefix" (include "observex.fullname" .))
-}}

{{- range $svc := $services }}
{{- if and $svc.vals.enabled $svc.vals.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.prefix }}-{{ $svc.comp }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "observex.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.comp }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.prefix }}-{{ $svc.comp }}
  minReplicas: {{ $svc.vals.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.vals.autoscaling.maxReplicas }}
  metrics:
    {{- if $svc.vals.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.vals.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $svc.vals.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $svc.vals.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      # Prevent flapping: wait 5 minutes before scaling down
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # Scale up faster than scale down
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
{{- end }}
{{- end }}
