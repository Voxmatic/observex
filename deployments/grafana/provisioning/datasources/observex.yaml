# ObserveX — Grafana datasource provisioning
# Drop this file into Grafana's provisioning/datasources/ directory
# for instant out-of-box dashboards with no manual configuration.
#
# Works with: Grafana 9+
# Datasources:
#   1. ObserveX Metrics (ClickHouse native table)
#   2. Loki (logs)
#   3. Tempo (traces)
#   4. ObserveX API (custom datasource via JSON API plugin)

apiVersion: 1

datasources:
  # ── ObserveX Metrics (ClickHouse) ──────────────────────────────────────────
  - name: ObserveX Metrics
    type: grafana-clickhouse-datasource
    uid: observex-metrics
    url: http://clickhouse:8123
    access: proxy
    isDefault: true
    jsonData:
      defaultDatabase: observex
      port: 8123
      protocol: http
      username: default
    editable: true

  # ── Loki (logs) ─────────────────────────────────────────────────────────────
  - name: ObserveX Logs
    type: loki
    uid: observex-loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        # Automatically link trace_id log label to Tempo traces
        - matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
          datasourceUid: observex-tempo
    editable: true

  # ── Tempo (distributed traces) ──────────────────────────────────────────────
  - name: ObserveX Traces
    type: tempo
    uid: observex-tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      tracesToLogs:
        datasourceUid: observex-loki
        tags: ["service_name", "pod"]
        mappedTags:
          - key: service.name
            value: service_name
        mapTagNamesEnabled: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: observex-metrics
      search:
        hide: false
      nodeGraph:
        enabled: true
    editable: true
