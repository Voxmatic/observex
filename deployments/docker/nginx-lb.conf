# ObserveX Load Balancer — nginx config
# Mirrors Dynatrace Image 4:
#   - dnsEntryPoint: agent-facing LB distributing across ActiveGates
#   - seedServerUrl: cluster-facing reverse proxy routing to ingestor nodes
#
# Port 4318 = cluster endpoint (seedServerUrl)
# ActiveGates use this as their CLUSTER_ENDPOINT

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # ── Upstream: ingestor cluster nodes (ObserveX Cluster) ──────────────────
    # In production add more ingestor replicas here for HA
    upstream observex_cluster {
        least_conn;
        server ingestor:4318 weight=1;
        # server ingestor-2:4318 weight=1;  # add for multi-node cluster
        # server ingestor-3:4318 weight=1;
        keepalive 32;
    }

    # ── Upstream: ActiveGates (for dnsEntryPoint agent LB) ────────────────────
    upstream activegate_pool {
        least_conn;
        server activegate:9999   weight=1;
        server activegate-2:9999 weight=1;
        keepalive 32;
    }

    # ── Server: seedServerUrl — cluster-facing reverse proxy ─────────────────
    # ActiveGates POST telemetry here; LB distributes to ingestor nodes
    server {
        listen 4318;
        server_name _;

        # Increase buffer for telemetry batches
        client_max_body_size 256m;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        proxy_connect_timeout      10s;
        proxy_read_timeout         60s;
        proxy_send_timeout         60s;

        # Pass ActiveGate identity headers through
        proxy_pass_request_headers on;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-LB-Node         "observex-lb";

        # Support gzip-compressed payloads from ActiveGates
        gunzip on;

        # Health check endpoint
        location /health {
            return 200 '{"status":"ok","role":"seedServerUrl","upstream":"observex_cluster"}';
            add_header Content-Type application/json;
        }

        # Route all telemetry to the ingestor cluster
        location / {
            proxy_pass http://observex_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
