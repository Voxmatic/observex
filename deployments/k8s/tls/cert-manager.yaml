# deployments/k8s/tls/cert-manager.yaml
#
# TLS certificate provisioning for ObserveX via cert-manager + Let's Encrypt.
#
# Prerequisites
# ─────────────
#   1. cert-manager installed in the cluster (v1.14+ recommended):
#        helm repo add jetstack https://charts.jetstack.io
#        helm install cert-manager jetstack/cert-manager \
#          --namespace cert-manager --create-namespace \
#          --set installCRDs=true
#
#   2. Your Ingress controller (nginx, Traefik, etc.) is handling external traffic.
#
#   3. DNS A record for your domain points to the Ingress external IP.
#
# Apply
# ─────
#   # 1. Apply the issuers (do this once per cluster)
#   kubectl apply -f deployments/k8s/tls/cert-manager.yaml
#
#   # 2. Watch certificate issuance
#   kubectl get certificate -n observex -w
#   kubectl describe certificaterequest -n observex
#
# ── How it works ──────────────────────────────────────────────────────────────
# cert-manager watches the Certificate resource below, calls the Let's Encrypt
# ACME API, completes an HTTP-01 challenge (cert-manager creates a temporary
# Ingress for the /.well-known/acme-challenge/ path), and stores the resulting
# TLS keypair in the secret named below. The Ingress controller then reads that
# secret for HTTPS termination. Certificates are auto-renewed 30 days before
# expiry with no manual intervention.
#
# ── Namespace note ────────────────────────────────────────────────────────────
# All resources below target the "observex" namespace.
# Replace with your actual namespace if different.

---
# ─── Let's Encrypt staging issuer ────────────────────────────────────────────
# Use this first. Staging has relaxed rate limits so you can test the ACME
# flow without burning your production quota. Staging certs are NOT trusted
# by browsers but are structurally identical to production ones.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: observex
spec:
  acme:
    # Let's Encrypt staging API endpoint
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Replace with your real email address — Let's Encrypt sends expiry notices here
    email: platform@observex.example.com
    privateKeySecretRef:
      # Stores the ACME account private key. Created automatically.
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            # Must match your Ingress class (nginx, traefik, etc.)
            ingressClassName: nginx

---
# ─── Let's Encrypt production issuer ─────────────────────────────────────────
# Use this once staging works. Production certs are browser-trusted.
# Hard rate limit: 50 certificates per registered domain per week.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: observex
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@observex.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

---
# ─── Certificate resource for ObserveX ───────────────────────────────────────
# cert-manager watches this and provisions the TLS secret automatically.
# The secret "observex-tls" is referenced by the Ingress resource.
#
# Replace observex.example.com with your actual domain.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: observex-tls
  namespace: observex
  labels:
    app.kubernetes.io/name: observex
    app.kubernetes.io/part-of: observex
spec:
  # Name of the K8s Secret that will hold the TLS keypair.
  # Must match the secretName in your Ingress tls[] block.
  secretName: observex-tls

  # Switch to letsencrypt-staging first, then change to letsencrypt-prod
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

  # Primary domain + any additional SANs (Subject Alternative Names)
  dnsNames:
    - observex.example.com
    # Add more SANs if you expose sub-services on separate subdomains:
    # - ingestor.observex.example.com
    # - grafana.observex.example.com

  # cert-manager will auto-renew when 2/3 of the validity period has elapsed
  # (Let's Encrypt certs are 90 days; renewal triggers at ~60 days)
  renewBefore: 720h   # 30 days

---
# ─── Ingress with TLS ─────────────────────────────────────────────────────────
# This supplements the Helm-managed Ingress with the cert-manager annotation.
# If you are using the Helm chart, set these values instead:
#
#   ingress.enabled: true
#   ingress.tls.enabled: true
#   ingress.tls.secretName: observex-tls
#   ingress.tls.certManager.clusterIssuer: letsencrypt-prod
#   global.domain: observex.example.com
#
# The manifest below is for bare-kubectl deployments (no Helm).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observex
  namespace: observex
  labels:
    app.kubernetes.io/name: observex
    app.kubernetes.io/part-of: observex
  annotations:
    # Tell cert-manager which ClusterIssuer to use
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx tuning for long-lived WebSocket + streaming connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    # HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - observex.example.com
      # Must match Certificate.spec.secretName above
      secretName: observex-tls
  rules:
    - host: observex.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: observex-api-gateway
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: observex-api-gateway
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observex-api-gateway
                port:
                  number: 3001
