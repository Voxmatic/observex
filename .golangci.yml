# ObserveX — golangci-lint configuration
# Run: golangci-lint run ./...

run:
  timeout: 5m
  go: "1.22"
  # Skip generated files and vendor
  skip-dirs:
    - vendor
    - ebpf/generated
  skip-files:
    - ".*_gen.go$"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - errcheck        # check error return values
    - gosimple        # simplification suggestions
    - govet           # go vet checks
    - ineffassign     # detect ineffectual assignments
    - staticcheck     # SA static analysis
    - unused          # detect unused code
    - gofmt           # formatting
    - goimports       # import ordering
    - misspell        # spell checker
    - revive          # linter with good defaults
    - gosec           # security checks
    - bodyclose       # check http body is closed
    - contextcheck    # check context usage
    - exhaustive      # exhaustive switch statements
    - gocritic        # additional checks
    - noctx           # check http.NewRequest without context
    - rowserrcheck    # sql.Rows.Err()
    - sqlclosecheck   # sql.Rows.Close()
    - nilerr          # return nil when err != nil
    - unparam         # unused function parameters

  disable:
    - gochecknoglobals  # we have some legitimate globals
    - wsl               # too strict whitespace
    - nlreturn          # too strict
    - funlen            # some handlers are necessarily long
    - godot             # comment dots
    - lll               # line length (code gen produces long lines)

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false  # allow _ = err for best-effort cleanup

  gosec:
    excludes:
      - G104  # Errors unhandled in defer (common pattern)
      - G304  # File path provided as taint input (intentional)

  govet:
    check-shadowing: true
    enable-all: true

  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false

  misspell:
    locale: US

  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - unnamedResult
      - whyNoLint

  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    # Test files are more lenient
    - path: "_test.go"
      linters: [gosec, errcheck, gocritic]

    # Main files can use log.Fatal
    - path: "main.go"
      text: "should not use log.Fatal"

    # Allow long functions in generated SQL
    - path: "internal/db"
      linters: [funlen]

  max-issues-per-linter: 50
  max-same-issues: 10
